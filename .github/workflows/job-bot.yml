name: CarrerFit job ingestion bot

on:
  workflow_dispatch:
  # Hostinger can suspend the Node process between requests, so its in-process
  # timer is only a fallback. This external schedule is the durable trigger.
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: carrerfit-job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh enabled public job sources
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          response="$(mktemp)"
          call_bot() {
            curl --ipv4 --fail-with-body --retry 6 --retry-all-errors --retry-delay 8 \
              --connect-timeout 25 --max-time 900 \
              -X POST "$1/api/cron/job-sources" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "user-agent: CarrerFit-JobBot/1.0" \
              --output "$response"
          }

          # Hostinger has intermittently timed out one CDN hostname for GitHub
          # runners. Try both production edges before treating the run as failed.
          call_bot "https://www.carrerfit.com" || call_bot "https://carrerfit.com"

          jq -e 'select(.runId and (.refreshed > 0)) | {
            ok,
            runId,
            sources,
            refreshed,
            failed,
            newJobs,
            activeJobs: .overview.stats.activeJobs,
            newInLast24Hours: .overview.stats.last24Hours,
            failedSources: .overview.stats.failedSources,
            failedSourceNames: [.overview.sources[] | select(.enabled and .lastStatus == "Failed") | .name]
          }' "$response"
