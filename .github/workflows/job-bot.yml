name: CarrerFit job ingestion bot

on:
  # Production now runs this refresh inside app.js every 30 minutes. Keep this
  # workflow for an authenticated manual fallback without recurring failures
  # when the hosting firewall temporarily rejects GitHub-hosted runners.
  workflow_dispatch:

concurrency:
  group: carrerfit-job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh enabled public job sources
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          response="$(mktemp)"
          # The www hostname uses Hostinger's CDN edge, which remains reachable
          # from GitHub runners when the apex edge temporarily rejects them.
          curl --ipv4 --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 900 \
            -X POST "https://www.carrerfit.com/api/cron/job-sources" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "user-agent: CarrerFit-JobBot/1.0" \
            --output "$response"

          jq -e '{
            ok,
            runId,
            sources,
            refreshed,
            failed,
            newJobs,
            activeJobs: .overview.stats.activeJobs,
            newInLast24Hours: .overview.stats.last24Hours,
            failedSources: .overview.stats.failedSources
          }' "$response"
